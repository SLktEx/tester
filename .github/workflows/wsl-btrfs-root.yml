name: WSL Btrfs root

on:
  pull_request:
    paths:
      - tools/experimental-wsl-btrfs-root.sh
      - tools/test-experimental-wsl-btrfs-root.sh
      - .github/workflows/wsl-btrfs-root.yml
  push:
    branches:
      - main
    paths:
      - tools/experimental-wsl-btrfs-root.sh
      - tools/test-experimental-wsl-btrfs-root.sh
      - .github/workflows/wsl-btrfs-root.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-tests:
    name: Shell tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static shellcheck

      - name: Check shell syntax
        run: |
          bash -n tools/experimental-wsl-btrfs-root.sh
          bash -n tools/test-experimental-wsl-btrfs-root.sh

      - name: Run ShellCheck
        run: |
          shellcheck tools/experimental-wsl-btrfs-root.sh
          # The test harness intentionally stores sourced globals, mock-only
          # functions, and literal '$@' snippets for generated-wrapper checks.
          shellcheck --exclude=SC2016,SC2034,SC2317 tools/test-experimental-wsl-btrfs-root.sh

      - name: Run unit tests
        run: bash tools/test-experimental-wsl-btrfs-root.sh

  wsl-smoke:
    name: WSL2 smoke (${{ matrix.distribution }})
    runs-on: windows-2025
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - Ubuntu-24.04
          - Debian-13

    steps:
      - name: Keep repository scripts as LF
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: ${{ matrix.distribution }}
          wsl-version: 2
          wsl-shell-user: root
          additional-packages: >-
            busybox-static
            btrfs-progs
            rsync
            util-linux

      - name: Show WSL environment
        shell: pwsh
        run: |
          wsl.exe --version
          wsl.exe --status
          wsl.exe --list --verbose

      - name: Run unit tests inside WSL
        shell: wsl-bash {0}
        run: |
          bash -n tools/experimental-wsl-btrfs-root.sh
          bash -n tools/test-experimental-wsl-btrfs-root.sh
          bash tools/test-experimental-wsl-btrfs-root.sh

      - name: Capture pre-pivot WSL mount state
        shell: wsl-bash {0}
        run: |
          {
            printf 'kernel=%q\n' "$(uname -r)"
            printf 'mnt_wsl_prop=%q\n' "$(findmnt -rn -o PROPAGATION -M /mnt/wsl 2>/dev/null || true)"
            if findmnt -rn -M /mnt/wslg >/dev/null 2>&1; then
              printf 'mnt_wslg_mount=1\n'
            else
              printf 'mnt_wslg_mount=0\n'
            fi
            if findmnt -rn -M /usr/lib/wsl >/dev/null 2>&1; then
              printf 'usr_lib_wsl_mount=1\n'
            else
              printf 'usr_lib_wsl_mount=0\n'
            fi
            if [ -d /run/booted-system/kernel-modules/lib/modules ]; then
              printf 'runtime_modules=1\n'
            else
              printf 'runtime_modules=0\n'
            fi
          } | tee /root/wsl-btrfs-preflight.env

          printf '%s\n' '--- pre-pivot mounts ---'
          findmnt -R /mnt || true
          findmnt -M /usr/lib/wsl || true
          findmnt -M /run/booted-system/kernel-modules || true

      - name: Install experimental Btrfs root
        shell: wsl-bash {0}
        run: bash tools/experimental-wsl-btrfs-root.sh install 16G

      - name: Restart WSL
        shell: pwsh
        run: |
          wsl.exe --shutdown
          Start-Sleep -Seconds 2

      - name: Validate pivoted root
        shell: wsl-bash {0}
        run: |
          set -Eeuo pipefail
          source /root/wsl-btrfs-preflight.env

          test "$(findmnt -n -o FSTYPE /)" = btrfs
          root_source=$(findmnt -n -o SOURCE / | sed 's/\[.*$//')
          case "$root_source" in
            /dev/loop*) ;;
            *) printf 'unexpected root source: %s\n' "$root_source" >&2; exit 1 ;;
          esac

          test -d /.wsl-bootstrap
          test -x /init
          findmnt -rn -M /mnt/wsl >/dev/null
          findmnt -rn -M /mnt/c >/dev/null
          test -d /mnt/c/Windows
          command -v powershell.exe >/dev/null
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' >/dev/null

          if [[ "$mnt_wsl_prop" == *shared* ]]; then
            post_mnt_wsl_prop=$(findmnt -rn -o PROPAGATION -M /mnt/wsl 2>/dev/null || true)
            case "$post_mnt_wsl_prop" in
              *shared*) ;;
              *) printf '/mnt/wsl lost shared propagation: %s -> %s\n' "$mnt_wsl_prop" "$post_mnt_wsl_prop" >&2; exit 1 ;;
            esac
          fi

          if [[ "$mnt_wslg_mount" == 1 ]]; then
            findmnt -rn -M /mnt/wslg >/dev/null
          fi

          if [[ "$usr_lib_wsl_mount" == 1 ]]; then
            findmnt -rn -M /usr/lib/wsl >/dev/null
          fi

          if [[ "$runtime_modules" == 1 ]]; then
            findmnt -rn -M /usr/lib/modules >/dev/null
          fi

          systemd_state=$(systemctl is-system-running 2>/dev/null || true)
          case "$systemd_state" in
            running|degraded) ;;
            *) printf 'unexpected systemd state: %s\n' "$systemd_state" >&2; exit 1 ;;
          esac

          # Prove that the preserved /mnt/wsl shared peer group still carries
          # a mount event across mount namespaces after pivot_root.
          if [[ "$mnt_wsl_prop" == *shared* ]]; then
            propagation_target=/mnt/wsl/.gha-btrfs-propagation-$$
            mkdir -p "$propagation_target"
            cleanup_propagation() {
              set +e
              mountpoint -q "$propagation_target" && umount "$propagation_target"
              rmdir "$propagation_target" 2>/dev/null || true
            }
            trap cleanup_propagation EXIT

            unshare --mount --propagation unchanged bash -c '
              set -e
              target=$1
              mount -t tmpfs -o size=1m tmpfs "$target"
              touch "$target/from-child-namespace"
              sleep 10
            ' bash "$propagation_target" &
            child=$!

            propagated=0
            for _ in $(seq 1 50); do
              if mountpoint -q "$propagation_target"; then
                propagated=1
                break
              fi
              sleep 0.1
            done
            if (( propagated == 0 )); then
              kill "$child" 2>/dev/null || true
              wait "$child" 2>/dev/null || true
              printf '/mnt/wsl mount event did not propagate from a child mount namespace\n' >&2
              exit 1
            fi
            test -f "$propagation_target/from-child-namespace"
            kill "$child" 2>/dev/null || true
            wait "$child" 2>/dev/null || true
            cleanup_propagation
            trap - EXIT
          fi

          # Exercise a mount created only after the pivot. This catches a
          # bootstrap that merely copied the mounts present at install time.
          drvfs_target=/mnt/gha-btrfs-drvfs
          mkdir -p "$drvfs_target"
          cleanup_drvfs() {
            set +e
            mountpoint -q "$drvfs_target" && umount "$drvfs_target"
            rmdir "$drvfs_target" 2>/dev/null || true
          }
          trap cleanup_drvfs EXIT
          mount -t drvfs C: "$drvfs_target"
          findmnt -rn -M "$drvfs_target" >/dev/null
          test -d "$drvfs_target/Windows"
          cleanup_drvfs
          trap - EXIT

          bash tools/experimental-wsl-btrfs-root.sh status

          second_install=$(bash tools/experimental-wsl-btrfs-root.sh install 16G 2>&1)
          printf '%s\n' "$second_install"
          grep -Fq 'already Btrfs' <<<"$second_install"

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          Write-Host '--- WSL distributions ---'
          wsl.exe --list --verbose
          Write-Host '--- root / mount propagation / init ---'
          wsl.exe -d '${{ matrix.distribution }}' -u root -- bash -lc "findmnt / || true; findmnt -R /mnt || true; findmnt -M /usr/lib/wsl || true; printf 'PID 1: '; tr '\0' ' ' </proc/1/cmdline; echo; printf 'PID 1 mount ns: '; readlink /proc/1/ns/mnt || true; echo; ps -eo pid,ppid,args | grep -E '(^|[[:space:]])/init([[:space:]]|$)|systemd' || true; lsns -t mnt || true; systemctl is-system-running || true"
